name: Build KBD8X-MKII Vial yeaahbac bodela

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kbd8x.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/base_container

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install QMK CLI
        run: |
          python3 -m pip install --break-system-packages qmk -r requirements.txt || python3 -m pip install qmk -r requirements.txt
          export PATH="/usr/local/bin:$HOME/.local/bin:/root/.local/bin:$PATH"
          qmk hello

      - name: Prepare Vial keymap for KBD8X-MKII
        run: |
          git config --global --add safe.directory '*'
          KB_DIR="keyboards/kbdfans/kbd8x_mk2"
          VIAL_DIR="$KB_DIR/keymaps/vial"
          mkdir -p "$VIAL_DIR"

          if [ -d "$KB_DIR/keymaps/via" ]; then
            cp -r "$KB_DIR/keymaps/via/"* "$VIAL_DIR/"
          else
            cp -r "$KB_DIR/keymaps/default/"* "$VIAL_DIR/"
          fi

          cat << 'EOF' > "$VIAL_DIR/rules.mk"
          VIA_ENABLE = yes
          VIAL_ENABLE = yes
          LTO_ENABLE = yes
          QMK_SETTINGS = no
          VIAL_KEY_OVERRIDE_ENABLE = no
          SPACE_CADET_ENABLE = no
          GRAVE_ESC_ENABLE = no
          MAGIC_ENABLE = no
          CONSOLE_ENABLE = no
          COMMAND_ENABLE = no
          EOF

          cat << 'EOF' > "$VIAL_DIR/config.h"
          #pragma once
          #define VIAL_KEYBOARD_UID {0x4B, 0x42, 0x44, 0x38, 0x58, 0x4D, 0x4B, 0x32}
          #define VIAL_UNLOCK_COMBO_ROWS { 0, 2 }
          #define VIAL_UNLOCK_COMBO_COLS { 0, 13 }
          #define VIAL_TAP_DANCE_ENTRIES 8
          #define VIAL_COMBO_ENTRIES 8
          #define DYNAMIC_KEYMAP_LAYER_COUNT 4
          EOF

          python3 - << 'PYEOF'
          import json, urllib.request

          url = "https://raw.githubusercontent.com/the-via/keyboards/master/src/kbdfans/kbd8x_mk2/kbd8x_mk2.json"
          req = urllib.request.urlopen(url)
          data = json.loads(req.read().decode("utf-8"))

          with open("keyboards/kbdfans/kbd8x_mk2/keymaps/vial/vial.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("Pomyślnie zapisano vial.json dla:", data.get("name", "KBD8X-MKII"))
          PYEOF

      - name: Compile Vial Firmware
        run: |
          export PATH="/usr/local/bin:$HOME/.local/bin:/root/.local/bin:$PATH"
          if ! make kbdfans/kbd8x_mk2:vial; then
            printf "\n#undef RGBLIGHT_ANIMATIONS\n#define NO_ACTION_ONESHOT\n" >> keyboards/kbdfans/kbd8x_mk2/keymaps/vial/config.h
            make kbdfans/kbd8x_mk2:vial
          fi

      - name: Upload HEX Firmware
        uses: actions/upload-artifact@v4
        with:
          name: kbdfans_kbd8x_mk2_vial_firmware
          path: "*.hex"
