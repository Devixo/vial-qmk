name: Build KBD8X-MKII Vial yeaahbac bodela
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kbd8x.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/base_container

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare Vial keymap for KBD8X-MKII
        run: |
          git config --global --add safe.directory '*'
          KB_DIR="keyboards/kbdfans/kbd8x_mk2"
          VIAL_DIR="$KB_DIR/keymaps/vial"
          mkdir -p "$VIAL_DIR"

          if [ -d "$KB_DIR/keymaps/via" ]; then
            cp -r "$KB_DIR/keymaps/via/"* "$VIAL_DIR/"
          else
            cp -r "$KB_DIR/keymaps/default/"* "$VIAL_DIR/"
          fi

          cat << 'EOF' > "$VIAL_DIR/rules.mk"
          VIA_ENABLE = yes
          VIAL_ENABLE = yes
          VIALRGB_ENABLE = no
          LTO_ENABLE = yes
          TAP_DANCE_ENABLE = yes
          COMBO_ENABLE = no
          KEY_OVERRIDE_ENABLE = no
          QMK_SETTINGS = no
          SPACE_CADET_ENABLE = no
          GRAVE_ESC_ENABLE = no
          MAGIC_ENABLE = no
          CONSOLE_ENABLE = no
          COMMAND_ENABLE = no
          EOF

          cat << 'EOF' > "$VIAL_DIR/config.h"
          #pragma once
          #define VIAL_KEYBOARD_UID {0x4B, 0x42, 0x44, 0x38, 0x58, 0x4D, 0x4B, 0x32}
          #define VIAL_UNLOCK_COMBO_ROWS { 0, 2 }
          #define VIAL_UNLOCK_COMBO_COLS { 0, 13 }
          #define VIAL_TAP_DANCE_ENTRIES 8
          #define DYNAMIC_KEYMAP_LAYER_COUNT 4
          EOF

          python3 - << 'PYEOF'
          import json, urllib.request

          urls = [
              "https://raw.githubusercontent.com/vial-kb/vial-gui/master/src/main/resources/base/via_keyboard_stack.json",
              "https://raw.githubusercontent.com/the-via/keyboards/master/src/kbdfans/kbd8x_mk2/kbd8x_mk2.json"
          ]

          target = None
          for url in urls:
              try:
                  req = urllib.request.urlopen(url)
                  data = json.loads(req.read().decode("utf-8"))
                  if "definitions" in data:
                      for k, v in data["definitions"].items():
                          if "kbd8x" in v.get("name", "").lower():
                              target = v
                              break
                  elif "layouts" in data:
                      target = data
                  if target:
                      break
              except Exception as e:
                  print("Pominięto URL:", url, e)

          if not target:
              raise RuntimeError("Nie udało się pobrać definicji układu KBD8X-MKII")

          with open("keyboards/kbdfans/kbd8x_mk2/keymaps/vial/vial.json", "w", encoding="utf-8") as f:
              json.dump(target, f, indent=2)
          print("Pomyślnie zapisano vial.json dla:", target.get("name", "KBD8X-MKII"))
          PYEOF

      - name: Compile Vial Firmware
        run: |
          if ! make kbdfans/kbd8x_mk2:vial; then
            cat << 'EOF' >> keyboards/kbdfans/kbd8x_mk2/keymaps/vial/config.h
          #undef RGBLIGHT_ANIMATIONS
          #undef RGBLIGHT_EFFECT_BREATHING
          #undef RGBLIGHT_EFFECT_RAINBOW_MOOD
          #undef RGBLIGHT_EFFECT_RAINBOW_SWIRL
          #undef RGBLIGHT_EFFECT_SNAKE
          #undef RGBLIGHT_EFFECT_KNIGHT
          #undef RGBLIGHT_EFFECT_CHRISTMAS
          #undef RGBLIGHT_EFFECT_STATIC_GRADIENT
          #undef RGBLIGHT_EFFECT_RGB_TEST
          #undef RGBLIGHT_EFFECT_ALTERNATING
          #undef RGBLIGHT_EFFECT_TWINKLE
          #define NO_ACTION_ONESHOT
          EOF
            make kbdfans/kbd8x_mk2:vial
          fi

      - name: Upload HEX Firmware
        uses: actions/upload-artifact@v4
        with:
          name: kbdfans_kbd8x_mk2_vial_firmware
          path: "*.hex"
